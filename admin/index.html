async function counts(){const ts=['products','categories','reviews','faqs','promotions'];const out={};await Promise.all(ts.map(async t=>{const {count}=await db.from(t).select('*',{count:'exact',head:true});out[t]=count||0}));const {count:pub}=await db.from('products').select('*',{count:'exact',head:true}).eq('published',true);const {count:feat}=await db.from('products').select('*',{count:'exact',head:true}).eq('featured',true);const {count:promo}=await db.from('products').select('*',{count:'exact',head:true}).eq('promotion',true);return {...out,published:pub||0,featured:feat||0,promo:promo||0}}
async function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));if(page==='dashboard'){const c=await counts();$('#view').innerHTML=`<div class="top"><div><h1>แดชบอร์ด</h1><div class="sub">ภาพรวมและการจัดการสินค้า NST JEWELRY</div></div></div><div class="cards">${[['◇',c.products,'จำนวนสินค้าทั้งหมด'],['✓',c.published,'สินค้าที่เผยแพร่'],['○',c.products-c.published,'สินค้าที่ซ่อน'],['★',c.featured,'สินค้าแนะนำ'],['%',c.promo,'โปรโมชัน']].map(x=>`<div class="card"><div>${x[0]}</div><div class="num">${x[1]}</div><div class="label">${x[2]}</div></div>`).join('')}</div><div class="panel"><h2>การดำเนินการด่วน</h2><div class="quick"><button data-go="products" data-new="1">＋ เพิ่มสินค้า</button><button data-go="products">◇ จัดการสินค้า</button><button data-go="categories">▤ จัดการหมวดหมู่</button><button data-go="settings">⚙ จัดการเว็บไซต์</button></div></div>`;return}
const d=defs[page],t=tableOf(page);if(page==='products'){const r=await db.from('categories').select('id,name').order('sort_order');categories=r.data||[]}const q=await db.from(t).select('*').order('created_at',{ascending:false});rows=q.data||[];const title=d.title;$('#view').innerHTML=`<div class="top"><div><h1>จัดการ${title}</h1><div class="sub">เพิ่ม แก้ไข และควบคุมการเผยแพร่ข้อมูล</div></div><button class="btn gold" id="newBtn">＋ เพิ่ม${title}</button></div><div class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหา..."><button class="btn ghost" id="refresh">รีเฟรช</button></div><div id="list"></div></div>`;draw(rows)}
function draw(list){const d=defs[page];if(!list.length){$('#list').innerHTML='<div class="empty">ยังไม่มีข้อมูล กดปุ่มเพิ่มข้อมูลเพื่อเริ่มต้น</div>';return}$('#list').innerHTML=`<div class="tablewrap"><table><thead><tr>${page==='products'?'<th>รูป</th>':''}<th>รายการ</th><th>สถานะ</th><th>วันที่สร้าง</th><th></th></tr></thead><tbody>${list.map(r=>`<tr>${page==='products'?`<td>${r.images?.[0]?`<img class="thumb" src="${esc(previewSrc(r.images[0]))}" loading="lazy" alt="">`:'<div class="thumb"></div>'}</td>`:''}<td><b>${esc(r[d.name]||'(ไม่มีชื่อ)')}</b>${r.sku?`<div class="label">${esc(r.sku)}</div>`:''}</td><td><span class="pill ${live(r)?'live':''}">${live(r)?'เผยแพร่':'ฉบับร่าง'}</span></td><td>${new Date(r.created_at).toLocaleDateString('th-TH')}</td><td class="actions"><button class="btn ghost" data-edit="${r.id}">แก้ไข</button><button class="btn danger" data-del="${r.id}">ลบ</button></td></tr>`).join('')}</tbody></table></div>`}
function assetPicker(k,multiple=false){return `<div class="image-preview" data-image-preview="${k}"><span class="empty-preview">ยังไม่ได้เลือกรูป</span></div><details class="asset-picker"><summary>เลือกรูปจากคลังที่เตรียมไว้</summary><div class="asset-grid">${assetImages.map(([src,name])=>`<button type="button" class="asset-choice" data-pick-image="${esc(src)}" data-image-target="${k}" data-multiple="${multiple?'1':'0'}"><img src="${esc(previewSrc(src))}" loading="lazy" alt=""><span>${esc(name)}</span></button>`).join('')}</div></details>`}
function imageControl(k,l,multiple=false,required=false){const control=multiple?`<textarea name="${k}" rows="3" data-image-input="${k}" placeholder="วาง URL รูปทีละบรรทัด" ${required?'required':''}></textarea>`:`<input name="${k}" type="text" data-image-input="${k}" placeholder="วาง URL รูป" ${required?'required':''}>`;return `<div class="image-field"><span>${l}</span><span class="image-help">กดเลือกจากเครื่อง หรือลากรูปมาวางได้เลย ระบบจะอัปโหลดและสร้างลิงก์ให้อัตโนมัติ</span><label class="upload-zone" data-upload-zone="${k}" for="file-${k}"><span><strong>＋ เลือกรูปจากอุปกรณ์</strong><small>แตะที่นี่ หรือลากรูปมาวาง · JPG, PNG, WEBP ไม่เกิน 25 MB · ระบบย่อและบีบอัดให้อัตโนมัติ · รูปสินค้าแนะนำแนวตั้ง 3:4</small></span></label><input class="image-file-input" id="file-${k}" type="file" accept="image/jpeg,image/png,image/webp" data-file-input="${k}" ${multiple?'multiple':''}>${assetPicker(k,multiple)}<details class="advanced-url"><summary>ตัวเลือกขั้นสูง: ใส่ URL รูปเอง</summary><div>${control}</div></details></div>`}
function input([k,l,t,req]){let h;if(t==='check')h=`<label class="check"><input name="${k}" type="checkbox"> ${l}</label>`;else if(t==='image'||t==='images')h=imageControl(k,l,t==='images',req===1);else if(t==='textarea'||t==='lines')h=`<label><span>${l}</span><textarea name="${k}" rows="${t==='lines'?4:5}" ${req===1?'required':''}></textarea></label>`;else if(t==='category')h=`<label><span>${l}</span><select name="${k}"><option value="">— ไม่ระบุ —</option>${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`;else if(t.startsWith('select:'))h=`<label><span>${l}</span><select name="${k}">${t.slice(7).split(',').map(x=>{const [v,n]=x.split('|');return `<option value="${v}">${n}</option>`}).join('')}</select></label>`;else h=`<label><span>${l}</span><input name="${k}" type="${t}" ${req===1?'required':''}></label>`;return `<div class="${req==='wide'?'wide':''}">${h}</div>`}
function updateImagePreview(k){const input=$(`[name="${k}"]`),box=$(`[data-image-preview="${k}"]`);if(!input||!box)return;const values=input.value.split('\n').map(s=>s.trim()).filter(Boolean);box.innerHTML=values.length?values.map((src,i)=>`<img src="${esc(previewSrc(src))}" loading="lazy" alt="ตัวอย่างรูป ${i+1}" onerror="this.style.opacity='.2'">`).join(''):'<span class="empty-preview">ยังไม่ได้เลือกรูป</span>'}
/* ====== รูปภาพ (2026-11-11) ======
 ค่าที่บันทึกยังเป็น ./assets/… เหมือนเดิม แต่ตัวอย่างในหน้า Admin ใช้ไฟล์เบาใน ../assets/img/
 และก่อนอัปโหลด ระบบย่อ + บีบอัดรูปในเบราว์เซอร์ (ไม่มีค่าใช้จ่าย) ได้ 2 ขนาด:
 <ชื่อ>-nst.webp (กว้างไม่เกิน 1600px) และ <ชื่อ>-nst.sm.webp (กว้างไม่เกิน 640px) ซึ่งหน้าเว็บจะเลือกใช้ตามขนาดจอ */
const OPT_SMALL={'hero':640,'section-custom-jewelry':640,'section-craftsmanship':640,'section-after-sales':640,'section-about':640,'category-diamond-rings':400,'category-engagement-rings':400,'category-wedding-rings':400,'category-earrings':400,'category-necklaces':400,'category-bracelets':400,'category-other-jewelry':400,'gallery-collection':600,'diamond-inspection':480,'store-interior-wall':480,'storefront':480,'store-interior':480};
function previewSrc(u){u=String(u||'').trim();const m=u.match(/^(?:\.\/|\.\.\/|\/)?assets\/(?:img\/)?([a-z0-9-]+?)(?:-\d+)?\.(?:png|jpe?g|webp)$/i);if(m&&OPT_SMALL[m[1]])return `../assets/img/${m[1]}-${OPT_SMALL[m[1]]}.webp`;if(/^\.\/assets\//.test(u))return '.'+u;if(/-nst\.(webp|jpe?g)$/i.test(u))return u.replace(/-nst\.(webp|jpe?g)$/i,'-nst.sm.$1');return u}
async function encodeImage(bitmap,maxW,maxH,type){const scale=Math.min(1,maxW/bitmap.width,maxH/bitmap.height),w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(bitmap,0,0,w,h);const toBlob=(t,q)=>new Promise(r=>c.toBlob(r,t,q));let blob=type!=='image/jpeg'?await toBlob('image/webp',0.82):null;if(!blob||blob.type!=='image/webp')blob=await toBlob('image/jpeg',0.85);if(!blob)throw new Error('เบราว์เซอร์นี้แปลงรูปไม่ได้');return {blob,w,h,ext:blob.type==='image/webp'?'webp':'jpg'}}
async function compressImage(file){let bitmap;try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bitmap=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(new Error('เปิดไฟล์รูปไม่ได้'));i.src=URL.createObjectURL(file)})}const big=await encodeImage(bitmap,1600,2000);const small=await encodeImage(bitmap,640,960,big.blob.type);bitmap.close?.();return {big,small}}
async function uploadImages(k,files){const input=$(`[name="${k}"]`),zone=$(`[data-upload-zone="${k}"]`);if(!input||!files?.length)return;const field=defs[page].fields.find(([name])=>name===k),multiple=field?.[2]==='images',accepted=[...files].filter(f=>/^image\/(jpeg|png|webp)$/i.test(f.type)&&f.size<=25*1024*1024);if(!accepted.length)return notify('กรุณาเลือกรูป JPG, PNG หรือ WEBP ขนาดไม่เกิน 25 MB');zone.classList.add('uploading');zone.querySelector('strong').textContent='กำลังย่อและอัปโหลดรูป…';try{const {data:{user}}=await db.auth.getUser();if(!user)throw new Error('กรุณาเข้าสู่ระบบใหม่');const uploaded=[];let savedKB=0;for(const file of accepted){const {big,small}=await compressImage(file);const base=`${user.id}/${Date.now()}-${crypto.randomUUID()}-nst`;for(const [suffix,img] of [['.sm',small],['',big]]){const {error}=await db.storage.from(STORAGE_BUCKET).upload(`${base}${suffix}.${img.ext}`,img.blob,{cacheControl:'31536000',upsert:false,contentType:img.blob.type});if(error)throw error}savedKB+=Math.max(0,(file.size-big.blob.size)/1024);const {data}=db.storage.from(STORAGE_BUCKET).getPublicUrl(`${base}.${big.ext}`);uploaded.push(data.publicUrl)}const values=multiple?input.value.split('\n').map(s=>s.trim()).filter(Boolean):[];input.value=(multiple?[...values,...uploaded]:uploaded.slice(-1)).join('\n');updateImagePreview(k);notify(`อัปโหลดรูปแล้ว ${uploaded.length} รูป · ลดขนาดได้ ${savedKB>1024?(savedKB/1024).toFixed(1)+' MB':Math.round(savedKB)+' KB'}`)}catch(err){notify('อัปโหลดไม่สำเร็จ: '+err.message)}finally{zone.classList.remove('uploading');zone.querySelector('strong').textContent='＋ เลือกรูปจากอุปกรณ์';const fileInput=$(`[data-file-input="${k}"]`);if(fileInput)fileInput.value=''}}
function openForm(row=null){editing=row?.id||null;const d=defs[page];$('#modalTitle').textContent=(row?'แก้ไข':'เพิ่ม')+d.title;$('#fields').innerHTML=d.fields.map(input).join('');if(row)d.fields.forEach(([k,,t])=>{const e=$(`[name="${k}"]`);if(!e)return;if(t==='check')e.checked=!!row[k];else if(t==='lines'||t==='images')e.value=Array.isArray(row[k])?row[k].join('\n'):(row[k]||'');else e.value=row[k]??''});d.fields.filter(([, ,t])=>t==='image'||t==='images').forEach(([k])=>updateImagePreview(k));$('#modal').classList.remove('hidden')}
async function save(e){e.preventDefault();const d=defs[page],row={};d.fields.forEach(([k,,t])=>{const x=e.target.elements[k];row[k]=t==='check'?x.checked:t==='number'?(x.value===''?null:Number(x.value)):(t==='lines'||t==='images')?x.value.split('\n').map(s=>s.trim()).filter(Boolean):(x.value||null)});const t=tableOf(page),r=editing?await db.from(t).update(row).eq('id',editing):await db.from(t).insert(row);if(r.error)return notify(r.error.message);closeModal();notify('บันทึกข้อมูลแล้ว');await render()}
function closeModal(){$('#modal').classList.add('hidden');editing=null}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pickImage){const k=b.dataset.imageTarget,x=$(`[name="${k}"]`),src=b.dataset.pickImage;if(!x)return;if(b.dataset.multiple==='1'){const values=x.value.split('\n').map(s=>s.trim()).filter(Boolean);if(!values.includes(src))values.push(src);x.value=values.join('\n')}else x.value=src;updateImagePreview(k);return}if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.go){page=b.dataset.go;await render();if(b.dataset.new)openForm()}if(b.id==='newBtn')openForm(defs[page].single?rows[0]:null);if(b.id==='refresh')render();if(b.dataset.edit)openForm(rows.find(r=>r.id===b.dataset.edit));if(b.dataset.del&&confirm('ยืนยันลบรายการนี้?')){const r=await db.from(tableOf(page)).delete().eq('id',b.dataset.del);if(r.error)notify(r.error.message);else{notify('ลบแล้ว');render()}}});
$('#search')?.addEventListener?.('input',()=>{});$('#editForm').onsubmit=save;$('#editForm').addEventListener('input',e=>{if(e.target.dataset.imageInput)updateImagePreview(e.target.name)});$('#closeModal').onclick=$('#cancel').onclick=closeModal;$('#loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#loginMsg').textContent=error?error.message:'';if(!error)boot()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('#viewSite').onclick=()=>location.href='../?view=home#top';$('#view').addEventListener('input',e=>{if(e.target.id==='search'){const q=e.target.value.toLowerCase();draw(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)))}});boot();
$('#editForm').addEventListener('change',e=>{if(e.target.dataset.fileInput)uploadImages(e.target.dataset.fileInput,e.target.files)});$('#editForm').addEventListener('dragover',e=>{const zone=e.target.closest('[data-upload-zone]');if(!zone)return;e.preventDefault();zone.classList.add('dragover')});$('#editForm').addEventListener('dragleave',e=>{const zone=e.target.closest('[data-upload-zone]');if(zone)zone.classList.remove('dragover')});$('#editForm').addEventListener('drop',e=>{const zone=e.target.closest('[data-upload-zone]');if(!zone)return;e.preventDefault();zone.classList.remove('dragover');uploadImages(zone.dataset.uploadZone,e.dataTransfer.files)});
</script></body></html>
